/*
 * This file was generated by the Gradle 'init' task and modified for gRPC practice.
 */

plugins {
    id 'java' // Tells gradle that this is a java application
    id 'application' // Allows defining a Main class and adds run tasks
    id 'com.google.protobuf' version '0.10.0' // Gradle plugin for Protobuf code generation
}

repositories {
    mavenCentral() // Use Maven Central for resolving dependencies.
}

dependencies {
    // Netty is the underlying high-performance network transport engine used by gRPC
    implementation 'io.grpc:grpc-netty-shaded:1.66.0'

    // Protobuf libraries that map binary messages to Java classes
    implementation 'io.grpc:grpc-protobuf:1.66.0'

    // Contains core client API classes like Channels, Stubs, and call mechanisms
    implementation 'io.grpc:grpc-stub:1.66.0'

    // Necessary for Java 9 and newer to resolve compilation annotations (@javax.annotation.Generated)
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

// ------ PROTOBUF CONFIGURATION BLOCK ------
// Since you removed this block, we need to add it back!
// Without this, Gradle will not know where to download the compiler (protoc) 
// or the gRPC plugin, and it will not generate the service stub classes.
protobuf {
    protoc {
        // Downloads the compiler to translate .proto files to Java
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        // Configures the gRPC code generator plugin
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.66.0'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {} // Tells the compiler to generate gRPC code alongside protobuf messages
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // Uses Java 21
    }
}

application {
    // We changed this to org.example.AppServer since your server class is AppServer, not App
    mainClass = 'org.example.AppServer'
}

// Defines a custom task to run your gRPC Client.
// Run with: ".\gradlew :app:runClient" (since it is inside the app/ directory module)
tasks.register('runClient', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    // We corrected this to org.example.AppClient (instead of App.AppClient)
    mainClass = 'org.example.AppClient'
    standardInput = System.in
}