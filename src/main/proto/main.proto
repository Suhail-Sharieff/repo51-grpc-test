// Specifies that we are using proto3 syntax. If omitted, it defaults to proto2.
syntax = "proto3";

// Generate separate files for each generated Java class (e.g. MyRequest, MyResponse) 
// instead of putting them all inside a single file wrapper.
option java_multiple_files = true;

// The Java package where the generated files will be written
option java_package = "com.example.grpc";

// The outer classname that will contain project metadata
option java_outer_classname = "MainProto";

// Define the gRPC service interface
service Greeter {
    // Defines a Simple RPC method named 'SayHello'
    // It accepts a 'MyRequest' message payload and returns a 'MyResponse' message payload
    rpc SayHello(MyRequest) returns (MyResponse);
}

// Define the data model for the input request
message MyRequest {
    // Field tag 1 designates this field in binary serialization format.
    // It is NOT the value of the name field!
    string name = 1;
}

// Define the data model for the output response
message MyResponse {
    // Field tag 1 designates this field in binary serialization format.
    string res = 1;
}
