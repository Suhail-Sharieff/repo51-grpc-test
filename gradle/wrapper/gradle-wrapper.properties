# Specifies where the Gradle distribution zip will be stored and unpacked
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Points to the local Gradle distribution zip in your workspace (.gradle-dist) 
# to avoid connection timeout issues when running Gradle tasks
distributionUrl=file\:///C\:/Users/suhai/Desktop/CP/.gradle-dist/gradle-8.10-bin.zip

# Increases the network connection timeout to 120 seconds in case a fallback network call is made
networkTimeout=120000

# Disables validating the distribution URL to speed up build initialization
validateDistributionUrl=false

# Specifies where the downloaded/local zip file is cached inside Gradle user home
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
